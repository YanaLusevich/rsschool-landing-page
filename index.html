<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Coffee House</title>
</head>
<body id="body">
    <div class="wrapper">
        <header class="header">
        <div class="header-container _container">
            <div class="header-logo"><img src="./images/header/logo.svg" alt="logo"></div>
            <div class="header-nav nav-menu">
                <ul class="nav-list">
                    <li class="nav-item"><a class="nav-link" href="#Favorite">Favorite coffee</a></li>
                    <li class="nav-item"><a class="nav-link" href="#About">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Mobile-App">Mobile app</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Contact">Contact us</a></li>
                    <div class="menu-burger">
                        <a class="menu-open-burger" href="./page_menu/index.html">Menu</a>
                        <svg class="menu-icon-burger" xmlns="http://www.w3.org/2000/svg" width="41" height="40" viewbox="0 0 41 40" fill="none">
                            <path d="M28.8333 18.9333V25C28.8333 30.5228 24.3561 35 18.8332 35H15.4999C9.97707 35 5.49992 30.5228 5.49992 25V18.9333C5.49992 18.602 5.76855 18.3333 6.09992 18.3333H28.2333C28.5646 18.3333 28.8333 18.602 28.8333 18.9333Z" stroke="#403F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.4999 15C20.4999 13.3334 21.6904 11.6667 24.0713 11.6667C24.5919 11.6667 25.2136 11.6667 25.8333 11.6667C27.4901 11.6667 28.8333 10.3236 28.8333 8.66671V5.83337" stroke="#403F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M13.8334 15V12.1667C13.8334 10.5098 15.1766 9.16667 16.8334 9.16667H20.1667C21.2713 9.16667 22.1667 8.27124 22.1667 7.16667V5" stroke="#403F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M27.1667 18.3334H31.3334C33.6346 18.3334 35.5001 20.1989 35.5001 22.5C35.5001 24.8012 33.6346 26.6667 31.3334 26.6667H28.8334" stroke="#403F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </ul>
            </div>
            <div class="menu-button">
                <div class="theme-switch">
                    <button type="button" class="sun">
                        <img class="theme-switch-sun" src="./images/header/sun.svg" alt="switch-sun">
                    </button>
                    <button type="button" class="moon">
                        <img class="theme-switch-moon" src="./images/header/moon.svg" alt="switch-moon">
                    </button>
                </div>
                <div class="menu">
                    <a class="menu-open" href="./page_menu/index.html">Menu</a>
                    <img class="menu-icon" src="./images/header/coffee-cup.svg" alt="menu">
                </div>
                <div id="burger" class="burger">
                    <div class="burger-line_container">
                        <span class="burger-line burger-line_first">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="2" viewbox="0 0 18 2" fill="none">
                            <path d="M1 1H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        </span>
                        <span class="burger-line burger-line_second">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="2" viewbox="0 0 18 2" fill="none">
                            <path d="M1 1H17" stroke="#403F3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        </span>
                    </div>   
                </div>
            </div>

        </div>
        </header>
    </div>

<script src="./script.js"></script>
</body>
</html>
